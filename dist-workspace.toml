[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. We intentionally ship tarballs only:
# the cargo-dist shell installer installs to ~/.cargo/bin and edits shell
# profiles, which is wrong for a standalone app. AUR is the system-install path.
installers = []
# Target platforms to build apps for (Rust target-triple syntax). WayColor is
# a Hyprland/Wayland app that shells out to hyprpicker — Linux only.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
